<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ChatServer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e0e10;
      color: #efeff1;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    main {
      box-sizing: border-box;
      height: 100%;
      padding: 36px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
    }
    .tagline {
      margin: 14px 0 28px;
      color: #adadb8;
      font-size: 16px;
      text-align: center;
    }
    .stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      height: 44px;
      padding: 0 14px;
      border: 2px solid transparent;
      border-radius: 4px;
      background: #18181b;
      color: #efeff1;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #9146ff;
    }
    input::placeholder {
      color: #53535f;
    }
    button {
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }
    #start {
      height: 40px;
      background: #9146ff;
      color: #fff;
    }
    #start:hover {
      background: #772ce8;
    }
    #start:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #error {
      min-height: 18px;
      color: #eb0400;
      font-size: 13px;
    }
    #linkbox {
      display: none;
      position: relative;
    }
    #linkbox.show {
      display: block;
    }
    #link {
      padding-right: 46px;
    }
    #copy {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #adadb8;
    }
    #copy:hover {
      background: #26262c;
      color: #efeff1;
    }
    #copy svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/icon.png" alt="">
    <div class="tagline">Локальный чат для OBS</div>
    <div class="stack">
      <input id="channel" placeholder="Канал или ссылка" autocomplete="off" spellcheck="false">
      <button id="start" type="button">Старт</button>
      <div id="error"></div>
      <div id="linkbox">
        <input id="link" readonly aria-label="Ссылка для OBS">
        <button id="copy" type="button" title="Скопировать" aria-label="Скопировать">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
  <script>
    const channelInput = document.getElementById('channel');
    const startButton = document.getElementById('start');
    const errorBox = document.getElementById('error');
    const linkBox = document.getElementById('linkbox');
    const linkInput = document.getElementById('link');

    function showLink(url) {
      if (!url) return;
      linkInput.value = url;
      linkBox.classList.add('show');
    }

    async function run() {
      errorBox.textContent = '';
      startButton.disabled = true;
      try {
        const result = await window.api.start(channelInput.value);
        if (result.channel) channelInput.value = result.channel;
        showLink(result.url);
        if (!result.ok) errorBox.textContent = result.error || 'Не вышло';
      } catch (err) {
        errorBox.textContent = err.message || 'Не вышло';
      } finally {
        startButton.disabled = false;
      }
    }

    startButton.addEventListener('click', run);
    channelInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') run();
    });
    document.getElementById('copy').addEventListener('click', () => {
      window.api.copy(linkInput.value);
    });

    if (window.api) {
      window.api.getChannel().then((channel) => {
        if (!channel) return;
        channelInput.value = channel;
        run();
      });
    }
  </script>
</body>
</html>
