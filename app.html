<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ChatServer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #161616;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      box-sizing: border-box;
      height: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-size: 13px;
      color: #bbb;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #111;
      color: #fff;
      font-size: 18px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 16px;
      cursor: pointer;
      background: #3dff8a;
      color: #111;
      font-weight: 700;
    }
    button.ghost {
      background: #2a2a2a;
      color: #fff;
      font-weight: 600;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row button {
      flex: 0 0 auto;
    }
    #error {
      min-height: 20px;
      color: #ff4d4d;
      font-size: 14px;
    }
    #linkbox {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #linkbox.show {
      display: flex;
    }
  </style>
</head>
<body>
  <main>
    <label for="channel">Twitch-канал</label>
    <input id="channel" placeholder="логин или ссылка" autocomplete="off" spellcheck="false">
    <button id="start" type="button">Старт</button>
    <div id="error"></div>
    <div id="linkbox">
      <label for="link">Ссылка для OBS</label>
      <div class="row">
        <input id="link" readonly>
        <button id="copy" class="ghost" type="button">Копировать</button>
      </div>
    </div>
  </main>
  <script>
    const channelInput = document.getElementById('channel');
    const startButton = document.getElementById('start');
    const errorBox = document.getElementById('error');
    const linkBox = document.getElementById('linkbox');
    const linkInput = document.getElementById('link');

    function showLink(url) {
      if (!url) return;
      linkInput.value = url;
      linkBox.classList.add('show');
    }

    async function run() {
      errorBox.textContent = '';
      startButton.disabled = true;
      startButton.textContent = 'Старт...';
      try {
        const result = await window.api.start(channelInput.value);
        if (result.channel) channelInput.value = result.channel;
        showLink(result.url);
        if (!result.ok) errorBox.textContent = result.error || 'Не вышло';
      } catch (err) {
        errorBox.textContent = err.message || 'Не вышло';
      } finally {
        startButton.disabled = false;
        startButton.textContent = 'Старт';
      }
    }

    startButton.addEventListener('click', run);
    channelInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') run();
    });
    document.getElementById('copy').addEventListener('click', () => {
      window.api.copy(linkInput.value);
    });

    window.api.getChannel().then((channel) => {
      if (!channel) return;
      channelInput.value = channel;
      run();
    });
  </script>
</body>
</html>
